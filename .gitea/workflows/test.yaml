---
# Workflow for testing this Go project

name: Test smolldb
run-name: Test smolldb
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27
    steps:
      # JavaScript actions (like checkout) need node inside the job container
      - name: Install Node
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v3
      - name: Run tests
        run: go test ./...
